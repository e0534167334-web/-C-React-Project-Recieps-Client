services:
  - type: web
    name: recipe-sharing-client
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://recipe-sharing-api-e53k.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
